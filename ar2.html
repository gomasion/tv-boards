<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR配置 v2（移動できる版）</title>
<style>
  body { font-family: sans-serif; margin: 16px; background: #111; color: #eee; }
  h1 { font-size: 20px; }
  button, label.filebtn {
    font-size: 18px; padding: 12px 18px; margin: 6px 4px;
    border-radius: 10px; border: none; background: #2b6cb0; color: #fff;
    display: inline-block; cursor: pointer;
  }
  button:disabled { background: #555; }
  #arBtn { background: #b7791f; font-size: 22px; padding: 16px 22px; }
  #status { margin: 12px 0; color: #a0e7a0; min-height: 1.4em; }
  .note { color: #bbb; font-size: 14px; line-height: 1.6; }
  /* AR中に出る操作パネル */
  #overlay {
    position: fixed; inset: 0; pointer-events: none;
    display: none; z-index: 10;
  }
  #overlay .panel {
    position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: rgba(0,0,0,0.55); border-radius: 14px; padding: 10px;
    text-align: center; pointer-events: auto;
  }
  #overlay button {
    font-size: 20px; padding: 10px 14px; margin: 3px;
    background: rgba(43,108,176,0.9);
  }
  #overlay .wide { background: rgba(183,121,31,0.9); }
  #ovStatus {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.55); color: #a0e7a0; border-radius: 8px;
    padding: 6px 14px; font-size: 16px; pointer-events: none;
    white-space: nowrap;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<h1>🏠 部屋に置く v2（移動・回転できる版）</h1>
<p class="note">
  GLBファイルを選んでから「ARで置く」を押してね。<br>
  ① 視線の先の丸（レティクル）が床に合ったら、トリガーで配置。<br>
  ② 置いた後は、モデル付近をトリガー長押ししながら動かすと<b>ドラッグ移動</b>、<br>
  画面下のボタン（コントローラの光線で指してトリガー）でも 前後左右・上下（高さ）・回転・大きさ を微調整できるよ。<br>
  コントローラの<b>スティック</b>でも操作可：<b>左スティック</b>で前後左右の移動、<b>右スティック</b>は上下で高さ・左右で回転。
</p>
<label class="filebtn">📂 GLBファイルを選ぶ<input type="file" id="file" accept=".glb,.gltf" style="display:none"></label>
<button id="arBtn" disabled>🏠 ARで置く</button>
<div id="status">まずGLBを選んでね（選ばない場合はサンプルの青い箱）</div>

<div id="overlay">
  <div id="ovStatus">床に視線を合わせてトリガーで配置</div>
  <div class="panel">
    <div>
      <button data-move="forward">前</button>
    </div>
    <div>
      <button data-move="left">左</button>
      <button data-move="back">後</button>
      <button data-move="right">右</button>
    </div>
    <div>
      <button data-height="up">⬆ 上</button>
      <button data-height="down">⬇ 下</button>
      <button data-rot="-1">↩ 回転</button>
      <button data-rot="1">回転 ↪</button>
      <button data-scale="up">大きく</button>
      <button data-scale="down">小さく</button>
    </div>
    <div>
      <button id="replaceBtn" class="wide">置き直す</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const statusEl = document.getElementById('status');
const ovStatus = document.getElementById('ovStatus');
const arBtn = document.getElementById('arBtn');
const overlay = document.getElementById('overlay');

let renderer, scene, camera;
let model = null;
let modelBaseY = 0;
let reticle = null;
let hitTestSource = null;
let refSpace = null;
let placed = false;
let dragSource = null;
// 瞬き用
let blinkTargets = [];
let lastBlinkName = null;
let nextBlinkAt = 0;
let blinkStart = -1;
// 呼吸用（上半身チェーンの微回転）
let breathSet = [];
let lastBreathName = null;
// アイジッター用（GOROman EyeJitter移植）
let eyeSet = [];
let lastEyeName = null;
let jitterQuat = new THREE.Quaternion();
let nextJitterAt = 0;
// 視線用（カメラを見る）
let lookNeck = null;
let lookHead = null;
let smEyeYaw = 0, smEyePitch = 0, smHeadYaw = 0, smHeadPitch = 0, smNeckYaw = 0, smNeckPitch = 0;
// ポーズ用（自然な立ちポーズ＋待機の揺れ）
let armBones = { upperL: null, upperR: null, foreL: null, foreR: null };
let hipsEntry = null;
let lastPoseName = null;

function setStatus(t) { statusEl.textContent = t; }
function setOv(t) { ovStatus.textContent = t; }

function initThree() {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
  const light = new THREE.HemisphereLight(0xffffff, 0x444444, 2.0);
  scene.add(light);
  const dir = new THREE.DirectionalLight(0xffffff, 1.5);
  dir.position.set(1, 3, 2);
  scene.add(dir);
  // レティクル（配置ガイドの丸）
  reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.09, 0.11, 32),
    new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide })
  );
  reticle.rotation.x = -Math.PI / 2;
  reticle.visible = false;
  scene.add(reticle);
}

function fitModel(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3();
  box.getSize(size);
  const center = new THREE.Vector3();
  box.getCenter(center);
  // 極端な大きさのモデルだけ身長1.4mに正規化
  if (size.y > 3 || size.y < 0.3) {
    const s = 1.4 / size.y;
    obj.scale.setScalar(s);
    box.setFromObject(obj);
    box.getSize(size);
    box.getCenter(center);
  }
  // 原点を足元中央へ
  obj.position.sub(new THREE.Vector3(center.x, box.min.y, center.z));
  const wrap = new THREE.Group();
  wrap.add(obj);
  return wrap;
}

function findBlinkTargets(root) {
  blinkTargets = [];
  lastBlinkName = null;
  root.traverse((o) => {
    if (o.isMesh && o.morphTargetDictionary) {
      const names = Object.keys(o.morphTargetDictionary);
      const picked = names.find(n => /vrc\.blink/i.test(n))
        || names.find(n => /blink/i.test(n))
        || names.find(n => n === 'eye_close');
      if (picked) {
        blinkTargets.push({ mesh: o, index: o.morphTargetDictionary[picked] });
        lastBlinkName = picked;
      }
    }
  });
  blinkStart = -1;
  nextBlinkAt = 0;
}

function findBreathBone(root) {
  breathSet = [];
  lastBreathName = null;
  const bones = [];
  root.traverse((o) => {
    if (o.isSkinnedMesh && o.skeleton) bones.push(...o.skeleton.bones);
  });
  // amp: 満吸気時の回転量(rad)。マイナス=背側(胸を開く) / プラス=胸側
  // Neck+Headの合計は Spine+Chest+UpperChest の打ち消し（頭の向きを一定に保つ）
  const roles = [
    { key: 'Spine', amp: -0.015, pat: /(^|[^a-z0-9])spine([^a-z0-9]|$)/i },
    { key: 'Chest', amp: -0.032, pat: /(^|[^a-z])chest([^a-z]|$)/i },
    { key: 'UpperChest', amp: -0.020, pat: /upper_?chest/i },
    { key: 'Neck', amp: 0.040, pat: /(^|[^a-z])neck([^a-z]|$)/i },
    { key: 'Head', amp: 0.027, pat: /(^|[^a-z])head([^a-z]|$)/i }
  ];
  root.updateMatrixWorld(true);
  const used = new Set();
  const foundNames = [];
  const modelRight = new THREE.Vector3(1, 0, 0);
  for (const role of roles) {
    const b = bones.find(bn => !used.has(bn) && role.pat.test(bn.name));
    if (!b) continue;
    used.add(b);
    // ローカル軸のうち「体の左右方向」に一番近い軸を回転軸として自動判定
    const wq = new THREE.Quaternion();
    b.getWorldQuaternion(wq);
    const units = [new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 1)];
    let bestAxis = units[0];
    let bestAbs = 0;
    let bestSign = 1;
    for (const u of units) {
      const world = u.clone().applyQuaternion(wq);
      const d = world.dot(modelRight);
      if (Math.abs(d) > bestAbs) {
        bestAbs = Math.abs(d);
        bestAxis = u;
        bestSign = d >= 0 ? 1 : -1;
      }
    }
    breathSet.push({ bone: b, base: b.quaternion.clone(), amp: role.amp, axis: bestAxis, sign: bestSign });
    foundNames.push(role.key);
  }
  if (foundNames.length) lastBreathName = foundNames.join('+');
}

function findEyeBones(root) {
  eyeSet = [];
  lastEyeName = null;
  const bones = [];
  root.traverse((o) => {
    if (o.isSkinnedMesh && o.skeleton) bones.push(...o.skeleton.bones);
  });
  const isEye = (n) => /eye/i.test(n) && !/lid|lash|brow/i.test(n);
  const left = bones.find(b => isEye(b.name) && /(^|[^a-z])l([^a-z]|$)|left/i.test(b.name));
  const right = bones.find(b => isEye(b.name) && /(^|[^a-z])r([^a-z]|$)|right/i.test(b.name));
  root.updateMatrixWorld(true);
  const found = [];
  for (const b of [left, right]) {
    if (!b) continue;
    const parentWorld = new THREE.Quaternion();
    if (b.parent) b.parent.getWorldQuaternion(parentWorld);
    eyeSet.push({
      bone: b,
      baseLocal: b.quaternion.clone(),
      parentWorld: parentWorld,
      parentWorldInv: parentWorld.clone().invert()
    });
    found.push(b.name);
  }
  if (found.length) lastEyeName = found.join('/');
  jitterQuat = new THREE.Quaternion();
  nextJitterAt = 0;
}

function findLookBones(root) {
  lookNeck = null;
  lookHead = null;
  const bones = [];
  root.traverse((o) => {
    if (o.isSkinnedMesh && o.skeleton) bones.push(...o.skeleton.bones);
  });
  root.updateMatrixWorld(true);
  const pick = (pat) => {
    const b = bones.find(bn => pat.test(bn.name));
    if (!b) return null;
    const parentWorld = new THREE.Quaternion();
    if (b.parent) b.parent.getWorldQuaternion(parentWorld);
    return { bone: b, parentWorld: parentWorld, parentWorldInv: parentWorld.clone().invert() };
  };
  lookNeck = pick(/(^|[^a-z])neck([^a-z]|$)/i);
  lookHead = pick(/(^|[^a-z])head([^a-z]|$)/i);
  smEyeYaw = 0; smEyePitch = 0; smHeadYaw = 0; smHeadPitch = 0; smNeckYaw = 0; smNeckPitch = 0;
}

function findPoseBones(root) {
  armBones = { upperL: null, upperR: null, foreL: null, foreR: null };
  hipsEntry = null;
  lastPoseName = null;
  const bones = [];
  root.traverse((o) => {
    if (o.isSkinnedMesh && o.skeleton) bones.push(...o.skeleton.bones);
  });
  const isL = (n) => /(^|[^a-z])l([^a-z]|$)|left/i.test(n);
  const isR = (n) => /(^|[^a-z])r([^a-z]|$)|right/i.test(n);
  const entry = (b) => {
    if (!b) return null;
    const parentWorld = new THREE.Quaternion();
    if (b.parent) b.parent.getWorldQuaternion(parentWorld);
    return { bone: b, baseLocal: b.quaternion.clone(), parentWorld: parentWorld, parentWorldInv: parentWorld.clone().invert() };
  };
  root.updateMatrixWorld(true);
  armBones.upperL = entry(bones.find(b => /upper_?arm/i.test(b.name) && isL(b.name)));
  armBones.upperR = entry(bones.find(b => /upper_?arm/i.test(b.name) && isR(b.name)));
  armBones.foreL = entry(bones.find(b => /fore_?arm|lower_?arm/i.test(b.name) && isL(b.name)));
  armBones.foreR = entry(bones.find(b => /fore_?arm|lower_?arm/i.test(b.name) && isR(b.name)));
  hipsEntry = entry(bones.find(b => /(^|[^a-z])hips([^a-z]|$)/i.test(b.name)));
  if (armBones.upperL || armBones.upperR) lastPoseName = '立ち';
}

// Tポーズ→自然な立ちポーズ（腕を下ろして肘を少し曲げる）
function applyStandingPose(root) {
  const deg = THREE.MathUtils.degToRad;
  const compose = (e, qModel) => {
    e.bone.quaternion.copy(e.parentWorldInv.clone().multiply(qModel).multiply(e.parentWorld).multiply(e.baseLocal));
  };
  const qx = (a) => new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), a);
  const qz = (a) => new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), a);
  if (armBones.upperL) compose(armBones.upperL, qz(-deg(78)).multiply(qx(-deg(6))));
  if (armBones.upperR) compose(armBones.upperR, qz(deg(78)).multiply(qx(-deg(6))));
  // 前腕は上腕をポーズした後の座標で付け直す
  root.updateMatrixWorld(true);
  const recapture = (e) => {
    if (!e) return;
    if (e.bone.parent) e.bone.parent.getWorldQuaternion(e.parentWorld);
    e.parentWorldInv.copy(e.parentWorld).invert();
  };
  recapture(armBones.foreL);
  recapture(armBones.foreR);
  if (armBones.foreL) compose(armBones.foreL, qx(-deg(12)));
  if (armBones.foreR) compose(armBones.foreR, qx(-deg(12)));
}

function setModel(obj) {
  if (model) { scene.remove(model); }
  model = fitModel(obj);
  model.visible = false;
  scene.add(model);
  findBlinkTargets(model);
  findBreathBone(model);
  findEyeBones(model);
  findLookBones(model);
  findPoseBones(model);
  applyStandingPose(model);
  arBtn.disabled = false;
}

async function loadGLB(url) {
  const loader = new GLTFLoader();
  const gltf = await loader.loadAsync(url);
  setModel(gltf.scene);
}

// ファイル選択
document.getElementById('file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  setStatus('読み込み中: ' + f.name);
  try {
    await loadGLB(URL.createObjectURL(f));
    setStatus('読み込み完了: ' + f.name
      + (lastBlinkName ? '（瞬き: ' + lastBlinkName + '）' : '（瞬きなし）')
      + (lastBreathName ? '（呼吸: ' + lastBreathName + '）' : '（呼吸なし）')
      + (lastEyeName ? '（目: ' + lastEyeName + '）' : '（目ボーンなし）')
      + (lastPoseName ? '（ポーズ: ' + lastPoseName + '）' : '（ポーズなし）')
      + ' → 「ARで置く」を押してね');
  } catch (err) {
    setStatus('読み込み失敗: ' + err.message);
  }
});

// サンプルの青い箱（model.txt = base64 GLB）
async function loadSample() {
  try {
    const res = await fetch('model.txt');
    if (!res.ok) return;
    const b64 = (await res.text()).trim();
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: 'model/gltf-binary' }));
    await loadGLB(url);
    setStatus('サンプルの青い箱を読み込んだよ。そのままARで置ける');
  } catch (e) { /* サンプルが無くてもファイル選択で使える */ }
}

function cameraForward() {
  const v = new THREE.Vector3();
  camera.getWorldDirection(v);
  v.y = 0;
  if (v.lengthSq() < 1e-6) v.set(0, 0, -1);
  return v.normalize();
}

function moveModel(dir) {
  if (!model || !placed) return;
  const step = 0.1;
  const fwd = cameraForward();
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0));
  if (dir === 'forward') model.position.addScaledVector(fwd, step);
  if (dir === 'back') model.position.addScaledVector(fwd, -step);
  if (dir === 'right') model.position.addScaledVector(right, step);
  if (dir === 'left') model.position.addScaledVector(right, -step);
}

overlay.querySelectorAll('[data-move]').forEach(b => {
  b.addEventListener('click', () => moveModel(b.dataset.move));
});
overlay.querySelectorAll('[data-height]').forEach(b => {
  b.addEventListener('click', () => {
    if (!model || !placed) return;
    const d = b.dataset.height === 'up' ? 0.05 : -0.05;
    model.position.y = Math.max(-0.2, Math.min(2.0, model.position.y + d));
  });
});
overlay.querySelectorAll('[data-rot]').forEach(b => {
  b.addEventListener('click', () => {
    if (model && placed) model.rotation.y += parseInt(b.dataset.rot) * Math.PI / 12;
  });
});
overlay.querySelectorAll('[data-scale]').forEach(b => {
  b.addEventListener('click', () => {
    if (!model || !placed) return;
    const f = b.dataset.scale === 'up' ? 1.1 : 1 / 1.1;
    model.scale.multiplyScalar(f);
  });
});
document.getElementById('replaceBtn').addEventListener('click', () => {
  placed = false;
  if (model) model.visible = false;
  setOv('床に視線を合わせてトリガーで配置');
});

arBtn.addEventListener('click', async () => {
  if (!renderer) initThree();
  if (!navigator.xr) { setStatus('このブラウザはWebXRに未対応'); return; }
  let session;
  try {
    session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay', 'local-floor'],
      domOverlay: { root: overlay }
    });
  } catch (e) {
    setStatus('AR開始失敗: ' + e.message);
    return;
  }
  overlay.style.display = 'block';
  await renderer.xr.setSession(session);
  try {
    refSpace = await session.requestReferenceSpace('local');
  } catch (e) {
    refSpace = await session.requestReferenceSpace('viewer');
  }
  const viewerSpace = await session.requestReferenceSpace('viewer');
  hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

  session.addEventListener('select', () => {
    if (!placed && reticle.visible && model) {
      model.position.setFromMatrixPosition(reticle.matrix);
      // カメラの方を向く
      const fwd = cameraForward();
      model.rotation.y = Math.atan2(fwd.x, fwd.z) + Math.PI;
      model.visible = true;
      placed = true;
      setOv('置けた！ドラッグかボタンで微調整できるよ');
    }
  });
  session.addEventListener('selectstart', (e) => { dragSource = e.inputSource; });
  session.addEventListener('selectend', () => {
    if (dragSource) dragSource._dragging = false;
    dragSource = null;
  });
  session.addEventListener('end', () => {
    overlay.style.display = 'none';
    placed = false;
    dragSource = null;
    if (model) model.visible = false;
    setOv('床に視線を合わせてトリガーで配置');
  });

  let lastT = 0;
  renderer.setAnimationLoop((time, frame) => {
    if (frame) {
      const dt = Math.min(0.05, (time - lastT) / 1000 || 0);
      lastT = time;
      // 待機の揺れ（体重移動のような微妙な揺れ）
      if (placed && hipsEntry) {
        const nowS = time / 1000;
        const roll = Math.sin(nowS * Math.PI * 2 / 6.5) * 0.010;
        const pitch = Math.sin(nowS * Math.PI * 2 / 9.3 + 1.3) * 0.006;
        const r = new THREE.Quaternion().setFromEuler(new THREE.Euler(pitch, 0, roll, 'YXZ'));
        hipsEntry.bone.quaternion.copy(
          hipsEntry.parentWorldInv.clone().multiply(r).multiply(hipsEntry.parentWorld).multiply(hipsEntry.baseLocal)
        );
      }
      // 呼吸アニメーション（BreathController方式: 吸う1.4s→吐く1.8s→休止0.6s = 3.8s周期）
      if (breathSet.length) {
        const nowB = time / 1000;
        const t = nowB % 3.8;
        let v;
        if (t < 1.4) {
          v = Math.sin((t / 1.4) * Math.PI / 2); // EaseOutSine
        } else if (t < 3.2) {
          const u = (t - 1.4) / 1.8;
          const eio = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; // EaseInOutQuad
          v = 1 - eio;
        } else {
          v = 0; // 休止期
        }
        for (const e of breathSet) {
          const q = new THREE.Quaternion().setFromAxisAngle(e.axis, e.amp * e.sign * v);
          e.bone.quaternion.copy(e.base).multiply(q);
        }
      }
      // 視線（カメラを見る: 目が主体、首と頭が遅れて少しついてくる）
      let rEye = null;
      if (placed && model && (eyeSet.length || lookHead)) {
        model.updateMatrixWorld(true);
        const camW = new THREE.Vector3();
        camera.getWorldPosition(camW);
        const camM = model.worldToLocal(camW.clone());
        let headM = new THREE.Vector3(0, 1.35, 0);
        if (lookHead) {
          const hw = new THREE.Vector3();
          lookHead.bone.getWorldPosition(hw);
          headM = model.worldToLocal(hw);
        }
        const dir = camM.sub(headM);
        if (dir.length() > 0.05) {
          dir.normalize();
          const yawT = Math.atan2(dir.x, dir.z);
          const pitchT = Math.atan2(dir.y, Math.hypot(dir.x, dir.z));
          const clamp = (v, a) => Math.max(-a, Math.min(a, v));
          const hYawT = clamp(yawT * 0.35, 0.55);
          const hPitchT = clamp(pitchT * 0.30, 0.22);
          const nYawT = yawT * 0.15;
          const nPitchT = pitchT * 0.12;
          const eYawT = clamp(yawT - hYawT - nYawT, 0.50);
          const ePitchT = clamp(pitchT - hPitchT - nPitchT, 0.30);
          const kE = 1 - Math.exp(-dt / 0.08);
          const kH = 1 - Math.exp(-dt / 0.35);
          const kN = 1 - Math.exp(-dt / 0.25);
          smEyeYaw += (eYawT - smEyeYaw) * kE;
          smEyePitch += (ePitchT - smEyePitch) * kE;
          smHeadYaw += (hYawT - smHeadYaw) * kH;
          smHeadPitch += (hPitchT - smHeadPitch) * kH;
          smNeckYaw += (nYawT - smNeckYaw) * kN;
          smNeckPitch += (nPitchT - smNeckPitch) * kN;
          const applyLook = (e, yaw, pitch) => {
            if (!e) return;
            const r = new THREE.Quaternion().setFromEuler(new THREE.Euler(-pitch, yaw, 0, 'YXZ'));
            const cur = e.bone.quaternion.clone();
            e.bone.quaternion.copy(e.parentWorldInv.clone().multiply(r).multiply(e.parentWorld).multiply(cur));
          };
          applyLook(lookNeck, smNeckYaw, smNeckPitch);
          applyLook(lookHead, smHeadYaw, smHeadPitch);
          rEye = new THREE.Quaternion().setFromEuler(new THREE.Euler(-smEyePitch, smEyeYaw, 0, 'YXZ'));
        }
      }
      // アイジッター（視線の上に小さく跳ぶ）
      if (eyeSet.length) {
        const nowJ = time / 1000;
        if (nextJitterAt === 0) nextJitterAt = nowJ + 0.5;
        if (nowJ >= nextJitterAt) {
          const rx = (Math.random() * 2 - 1) * 0.001;
          const ry = (Math.random() * 2 - 1) * 0.03;
          const qy = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), ry);
          const qx = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), rx);
          jitterQuat = qy.multiply(qx);
          nextJitterAt = nowJ + 0.3 + Math.random() * 1.2;
        }
        for (const e of eyeSet) {
          const worldBase = e.parentWorld.clone().multiply(e.baseLocal);
          let worldNew = jitterQuat.clone();
          if (rEye) worldNew.multiply(rEye);
          worldNew.multiply(worldBase);
          e.bone.quaternion.copy(e.parentWorldInv.clone().multiply(worldNew));
        }
      }
      // 瞬きアニメーション
      if (blinkTargets.length) {
        const now = time / 1000;
        if (nextBlinkAt === 0) nextBlinkAt = now + 1.2;
        if (blinkStart < 0 && now >= nextBlinkAt) blinkStart = now;
        if (blinkStart >= 0) {
          const t = (now - blinkStart) / 0.22;
          if (t >= 1) {
            blinkTargets.forEach(bt => { bt.mesh.morphTargetInfluences[bt.index] = 0; });
            blinkStart = -1;
            nextBlinkAt = now + 2.2 + Math.random() * 2.8;
          } else {
            const v = Math.sin(Math.PI * t);
            blinkTargets.forEach(bt => { bt.mesh.morphTargetInfluences[bt.index] = v; });
          }
        }
      }
      // スティック操作: 左=前後左右の移動 / 右=高さ・回転
      if (placed && model && session) {
        for (const src of session.inputSources) {
          const gp = src.gamepad;
          if (!gp || !gp.axes || gp.axes.length < 4) continue;
          const ax = gp.axes[2];
          const ay = gp.axes[3];
          if (src.handedness === 'left') {
            if (Math.abs(ax) > 0.2 || Math.abs(ay) > 0.2) {
              const fwd = cameraForward();
              const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0));
              model.position.addScaledVector(fwd, -ay * dt * 0.6);
              model.position.addScaledVector(right, ax * dt * 0.6);
            }
          } else {
            if (Math.abs(ay) > 0.35) {
              model.position.y = Math.max(-0.2, Math.min(2.0, model.position.y - ay * dt * 0.35));
            }
            if (Math.abs(ax) > 0.35) {
              model.rotation.y -= ax * dt * 1.4;
            }
          }
        }
      }
      // ヒットテストでレティクル更新
      if (!placed && hitTestSource) {
        const results = frame.getHitTestResults(hitTestSource);
        if (results.length > 0) {
          const pose = results[0].getPose(refSpace);
          reticle.visible = true;
          reticle.position.set(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
          reticle.updateMatrix();
        } else {
          reticle.visible = false;
        }
      } else {
        reticle.visible = false;
      }
      // ドラッグ移動: コントローラのレイと床面(y=model位置)の交点へ
      if (placed && dragSource && model) {
        const pose = frame.getPose(dragSource.targetRaySpace, refSpace);
        if (pose) {
          const o = pose.transform.position;
          const q = pose.transform.orientation;
          const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(
            new THREE.Quaternion(q.x, q.y, q.z, q.w));
          if (Math.abs(dir.y) > 1e-4) {
            const t = (model.position.y - o.y) / dir.y;
            if (t > 0) {
              const hx = o.x + dir.x * t;
              const hz = o.z + dir.z * t;
              const dx = hx - model.position.x;
              const dz = hz - model.position.z;
              // モデル付近(0.6m以内)を掴んだ時だけドラッグ
              if (Math.hypot(dx, dz) < 0.6 || dragSource._dragging) {
                dragSource._dragging = true;
                model.position.x = hx;
                model.position.z = hz;
              }
            }
          }
        }
      }
    }
    renderer.render(scene, camera);
  });
});

initThree();
loadSample();
</script>
